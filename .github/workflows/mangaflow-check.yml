name: MangaFlow checks
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm --prefix client ci
      - run: npm --prefix client run build
      - run: node --test mangaflow/timeline.test.js
      - run: npx tsc --noEmit --jsx react-jsx --esModuleInterop --moduleResolution node --target es2020 --skipLibCheck src/MangaFlow/types.ts src/MangaFlow/timeline.ts src/MangaFlow/MangaFlowComposition.tsx
